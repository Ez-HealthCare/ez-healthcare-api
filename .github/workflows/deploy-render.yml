name: Deploy API to Render

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy (for example: feat-doctor)'
        required: true
        default: feat-doctor
        type: string

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'

    steps:
      - name: Check deploy hook configuration
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Add the RENDER_DEPLOY_HOOK_URL repository secret first."
            exit 1
          fi

      - name: Check out the selected branch
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

      - name: Request Render deployment of the checked commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          status=$(curl --silent --show-error --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            --get --data-urlencode "ref=$DEPLOY_SHA" \
            "$RENDER_DEPLOY_HOOK_URL")
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "::error::Render rejected the deploy request (HTTP $status)."
            exit 1
          fi
          printf 'Render accepted deployment of `%s`. Check Render Deploys until it is Live.\n' \
            "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
